name: Build zh APK

# Fork-only workflow: builds the foss release APK with the Simplified Chinese
# translation and publishes it as the `zh-latest` pre-release of this fork.
on:
  push:
    branches: [zh-build]
    paths-ignore:
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-zh
  cancel-in-progress: true

jobs:
  build:
    name: Build foss APK (zh)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'

      - name: Install the pinned NDK
        run: |
          set -euo pipefail
          ndk="$(sed -n 's/^ndk = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          sdkmanager --install "ndk;$ndk"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Materialise the signing keystore (optional)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_KEYSTORE_BASE64:-}" ]]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the fork's release key."
          else
            echo "::warning::No RELEASE_KEYSTORE_BASE64 secret: the APK is signed with a throwaway debug key and cannot update a previous install."
          fi

      - name: Generate the bundled-docs index (incl. zh)
        run: ./gradlew :app:syncBundledDocs --no-daemon --stacktrace

      - name: Assemble the foss release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleFossRelease --no-daemon --stacktrace

      - name: Collect the APK
        id: apk
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/foss/release -name '*.apk' | head -1)"
          test -n "$apk"
          out="knotwork-zh-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}.apk"
          cp "$apk" "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          ls -la "$out"

      - name: Print the signing certificate
        id: cert
        run: |
          set -euo pipefail
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs "${{ steps.apk.outputs.file }}" | tee certs.txt
          fp="$(sed -n 's/.*certificate SHA-256 digest: //p' certs.txt | head -1)"
          echo "sha256=$fp" >> "$GITHUB_OUTPUT"

      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: knotwork-zh-apk
          path: ${{ steps.apk.outputs.file }}

      - name: Publish the zh-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete zh-latest --yes --cleanup-tag || true
          gh release create zh-latest "${{ steps.apk.outputs.file }}" \
            --prerelease --target "$GITHUB_SHA" \
            --title "Knotwork 简体中文版（自动构建）" \
            --notes "非官方的简体中文构建，基于 ${GITHUB_SHA::7}。界面、内置模板与帮助文档均已汉化；给模型看的提示词保持英文。签名证书 SHA-256：${{ steps.cert.outputs.sha256 }}"
